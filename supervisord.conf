[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nextjs]
command=npm run start
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/nextjs.out.log
stderr_logfile=/var/log/nextjs.err.log

[program:lane_vm_hypervisor]
command=python3 scripts/rusty_cpython_compiler.py --run-hypervisor --cycles 500
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/lane_vm_hypervisor.out.log
stderr_logfile=/var/log/lane_vm_hypervisor.err.log

[program:dual_lane_vm_serial_runner]
command=python3 win11_vm_creator.py --serial-dual-vm
directory=/app
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/dual_lane_vm.out.log
stderr_logfile=/var/log/dual_lane_vm.err.log

[program:sec_gist_sync_daemon]
command=python3 scripts/sec_gist_sync.py --update-gist
directory=/app
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/sec_gist_sync.out.log
stderr_logfile=/var/log/sec_gist_sync.err.log

[program:alberthub_engine]
command=python3 scripts/alberthub_engine.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/alberthub_engine.out.log
stderr_logfile=/var/log/alberthub_engine.err.log

[program:firewall_telemetry]
command=python3 scripts/firewall_telemetry.py
directory=/app
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/firewall_telemetry.out.log
stderr_logfile=/var/log/firewall_telemetry.err.log
