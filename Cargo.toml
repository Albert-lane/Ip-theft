[package]
name = "lane-vm-rusty-hypervisor"
version = "1.2.0"
edition = "2021"
authors = ["Albert Lane <gmail@albertlane.net>"]
description = "Sovereign Non-Decrypting Hypervisor & Dual-VM Serial Orchestration Substrate"
license = "SEE LICENSE IN license.md"

[lib]
name = "lane_vm_hypervisor"
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = { version = "=0.10.8", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
serde = { version = "=1.0.210", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.128", default-features = false, features = ["alloc"] }
spin = { version = "=0.9.8", default-features = false, features = ["mutex"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
