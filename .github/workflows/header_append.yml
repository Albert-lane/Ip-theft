name: Append Headers
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/30 * * * *'
jobs:
  append_headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Decrypt Code
        run: python scripts/cipher.py decrypt
      - name: Run Header Script
        run: python scripts/append_headers.py
      - name: Encrypt Code
        run: python scripts/cipher.py encrypt
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto-append proprietary headers" || exit 0
          git push
