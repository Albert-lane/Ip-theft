name: Auto-Repair Workflow
on:
  schedule:
    # Runs on a 15-minute cadence, offset by 2 minutes from the primary debugger (e.g., 2, 17, 32, 47)
    - cron: '2,17,32,47 * * * *'
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Decrypt Code
        run: python scripts/cipher.py decrypt
      - name: Execute Repair Pass
        run: python scripts/repair.py
      - name: Encrypt Code
        run: python scripts/cipher.py encrypt
