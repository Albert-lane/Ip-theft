version: '3.8'
services:
  blockchain-node-1:
    image: albertlane/centrifugal_blockchain1:latest
    build:
      context: .
      dockerfile: Dockerfile.joules
    volumes:
      - ./vault:/app/vault
      - ./joules_bot_model:/app/joules_bot_model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
